<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="個人旅行 PWA — 行程、天氣、導航、記帳">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅">
  <title>旅 · Travel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頁首 -->
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title" id="trip-title">旅</h1>
      <p class="app-subtitle" id="trip-dates"></p>
    </div>
  </header>

  <!-- 主要分頁 -->
  <main id="main">

    <!-- ===== 每日行程分頁 ===== -->
    <section id="view-itinerary" class="view active" aria-label="每日行程">
      <div class="day-selector" id="day-selector" role="tablist"></div>
      <div id="day-content" class="day-content"></div>
    </section>

    <!-- ===== 旅行資訊分頁（航班 / 住宿 / 緊急聯絡） ===== -->
    <section id="view-info" class="view" aria-label="旅行資訊">
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">✈</span>航班資訊</h2>
        <div id="flight-list"></div>
      </div>
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">宿</span>住宿資訊</h2>
        <div id="stay-list"></div>
      </div>
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">☏</span>緊急聯絡電話</h2>
        <div id="contact-list"></div>
      </div>
    </section>

    <!-- ===== 後備方案分頁（備用景點 / 餐廳 / 活動 / 住宿） ===== -->
    <section id="view-backup" class="view" aria-label="後備方案">
      <div id="backup-content"></div>
    </section>

    <!-- ===== 記帳與預算分頁 ===== -->
    <section id="view-expense" class="view" aria-label="記帳與預算">
      <div class="budget-summary" id="budget-summary"></div>

      <form id="expense-form" class="expense-form" autocomplete="off">
        <div class="form-row">
          <input type="text" id="exp-title" placeholder="項目（例：一蘭拉麵）" required maxlength="40">
        </div>
        <div class="form-row form-row-split">
          <input type="number" id="exp-amount" placeholder="金額" inputmode="decimal" min="0" step="any" required>
          <select id="exp-currency" aria-label="幣別"></select>
        </div>
        <div class="form-row form-row-split">
          <select id="exp-category" aria-label="分類">
            <option value="food">🍜 餐飲</option>
            <option value="transport">🚌 交通</option>
            <option value="shopping">🛍 購物</option>
            <option value="ticket">🎫 門票</option>
            <option value="stay">🏨 住宿</option>
            <option value="other">📦 其他</option>
          </select>
          <input type="date" id="exp-date" required>
        </div>
        <button type="submit" class="btn-primary" id="exp-submit">記一筆</button>
      </form>

      <div class="expense-list-header">
        <h2 class="section-title"><span class="section-icon">計</span>消費明細</h2>
        <span id="sync-status" class="sync-status"></span>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>

  </main>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav" aria-label="主選單">
    <button class="nav-btn active" data-view="view-itinerary" aria-label="行程">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="17" rx="3"/>
          <path d="M3 9.5h18"/>
          <path d="M8 2.5v4M16 2.5v4"/>
          <path d="M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01"/>
          <path d="M8.5 17.5h.01M12 17.5h.01M15.5 17.5h.01"/>
        </svg>
      </span>
      <span class="nav-label">行程</span>
    </button>
    <button class="nav-btn" data-view="view-info" aria-label="資訊">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11.5V17"/>
          <path d="M12 7.5h.01"/>
        </svg>
      </span>
      <span class="nav-label">資訊</span>
    </button>
    <button class="nav-btn" data-view="view-backup" aria-label="後備">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
          <circle cx="18.5" cy="18" r="2.5"/>
        </svg>
      </span>
      <span class="nav-label">後備</span>
    </button>
    <button class="nav-btn" data-view="view-expense" aria-label="記帳">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="18" height="13.5" rx="3"/>
          <path d="M3 10.5h18"/>
          <path d="M16.5 15h.01"/>
        </svg>
      </span>
      <span class="nav-label">記帳</span>
    </button>
  </nav>

  <!-- Firebase 只用於選用的 Firestore 記帳同步；網站仍由 GitHub Pages 託管。 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
