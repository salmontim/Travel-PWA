<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="個人旅行 PWA — 行程、天氣、導航、記帳">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅">
  <title>旅 · Travel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頁首 -->
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title" id="trip-title">旅</h1>
      <p class="app-subtitle" id="trip-dates"></p>
    </div>
  </header>

  <!-- 主要分頁 -->
  <main id="main">

    <!-- ===== 每日行程分頁 ===== -->
    <section id="view-itinerary" class="view active" aria-label="每日行程">
      <div class="day-selector" id="day-selector" role="tablist"></div>
      <div id="day-content" class="day-content"></div>
    </section>

    <!-- ===== 旅行資訊分頁（航班 / 住宿 / 緊急聯絡） ===== -->
    <section id="view-info" class="view" aria-label="旅行資訊">
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">✈</span>航班資訊</h2>
        <div id="flight-list"></div>
      </div>
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">宿</span>住宿資訊（已訂・2026-09-23 核實）</h2>
        <div id="stay-list"></div>
      </div>
      <div class="info-block">
        <h2 class="section-title"><span class="section-icon">☏</span>緊急聯絡電話</h2>
        <div id="contact-list"></div>
      </div>
    </section>

    <!-- ===== 後備方案分頁（備用景點 / 餐廳 / 活動 / 住宿） ===== -->
    <section id="view-backup" class="view" aria-label="後備方案">
      <div id="backup-content"></div>
    </section>

    <!-- ===== 記帳與預算分頁 ===== -->
    <section id="view-expense" class="view" aria-label="記帳與預算">
      <div class="budget-summary" id="budget-summary"></div>

      <form id="expense-form" class="expense-form" autocomplete="off">
        <div class="form-row">
          <input type="text" id="exp-title" placeholder="項目（例：一蘭拉麵）" required maxlength="40">
        </div>
        <div class="form-row form-row-split">
          <input type="number" id="exp-amount" placeholder="金額" inputmode="decimal" min="0" step="any" required>
          <select id="exp-currency" aria-label="幣別"></select>
        </div>
        <div class="form-row form-row-split">
          <select id="exp-category" aria-label="分類">
            <option value="food">🍜 餐飲</option>
            <option value="transport">🚌 交通</option>
            <option value="shopping">🛍 購物</option>
            <option value="ticket">🎫 門票</option>
            <option value="stay">🏨 住宿</option>
            <option value="other">📦 其他</option>
          </select>
          <input type="date" id="exp-date" required>
        </div>
        <button type="submit" class="btn-primary" id="exp-submit">記一筆</button>
      </form>

      <div class="expense-list-header">
        <h2 class="section-title"><span class="section-icon">計</span>消費明細</h2>
        <span id="sync-status" class="sync-status"></span>
      </div>

      <div class="expense-tools">
        <select id="exp-sort" aria-label="排序方式">
          <option value="date-desc">📅 日期 新→舊</option>
          <option value="date-asc">📅 日期 舊→新</option>
          <option value="amount-desc">💰 金額 高→低</option>
          <option value="amount-asc">💰 金額 低→高</option>
        </select>
        <select id="exp-filter" aria-label="篩選分類">
          <option value="all">全部分類</option>
          <option value="food">🍜 餐飲</option>
          <option value="transport">🚌 交通</option>
          <option value="shopping">🛍 購物</option>
          <option value="ticket">🎫 門票</option>
          <option value="stay">🏨 住宿</option>
          <option value="other">📦 其他</option>
        </select>
      </div>
      <div class="expense-summary" id="expense-summary"></div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>

  </main>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav" aria-label="主選單">
    <button class="nav-btn active" data-view="view-itinerary" aria-label="行程">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="17" rx="3"/>
          <path d="M3 9.5h18"/>
          <path d="M8 2.5v4M16 2.5v4"/>
          <path d="M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01"/>
          <path d="M8.5 17.5h.01M12 17.5h.01M15.5 17.5h.01"/>
        </svg>
      </span>
      <span class="nav-label">行程</span>
    </button>
    <button class="nav-btn" data-view="view-info" aria-label="資訊">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11.5V17"/>
          <path d="M12 7.5h.01"/>
        </svg>
      </span>
      <span class="nav-label">資訊</span>
    </button>
    <button class="nav-btn" data-view="view-backup" aria-label="後備">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
          <circle cx="18.5" cy="18" r="2.5"/>
        </svg>
      </span>
      <span class="nav-label">後備</span>
    </button>
    <button class="nav-btn" data-view="view-expense" aria-label="記帳">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="18" height="13.5" rx="3"/>
          <path d="M3 10.5h18"/>
          <path d="M16.5 15h.01"/>
        </svg>
      </span>
      <span class="nav-label">記帳</span>
    </button>
  </nav>

  <!-- Firebase 只用於選用的 Firestore 記帳同步；網站仍由 GitHub Pages 託管。 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Service Worker 更新流程
       ------------------------------------------------------------
       目標：加到 iOS 主畫面之後，「唔需要重新 pin 過」都食到新版。

       iOS 主畫面 App 多數只係被「喚醒」而唔係重新啟動，
       所以唔可以單靠瀏覽器預設嘅更新時機。以下四點齊做：
         1. updateViaCache:'none' —— 唔用 HTTP 快取載入 sw.js
            （GitHub Pages 對 sw.js 發 max-age=600，會拖慢偵測最多 10 分鐘）
         2. 回到前景即 reg.update()
         3. 每 30 分鐘背景檢查一次
         4. 新 SW 接管（controllerchange）即自動 reload，
            否則畫面仍然跑舊 JS
       ------------------------------------------------------------ */
    if ('serviceWorker' in navigator) {
      // 首次安裝時 controller 為 null；之後為既有 SW，用嚟分辨
      // 「第一次安裝」同「版本更新」，避免首開 App 多餘 reload。
      // ⚠️ 必須用 let 並在首次接管後設為 true：否則同一個頁面
      //    （iOS 主畫面 App 可以連續開幾日唔關）之後每次更新都會
      //    被誤判成「首次安裝」，就永遠唔會自動 reload。
      let hadController = !!navigator.serviceWorker.controller;
      let reloading = false;

      /** 正在輸入時唔打斷使用者，改為顯示提示按鈕 */
      function showUpdatePill() {
        if (document.getElementById('sw-update-pill')) return;
        const btn = document.createElement('button');
        btn.id = 'sw-update-pill';
        btn.type = 'button';
        btn.textContent = '🔄 有新版本，撳此更新';
        btn.addEventListener('click', () => {
          reloading = true;
          window.location.reload();
        });
        document.body.appendChild(btn);
      }

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        const isFirstClaim = !hadController;
        hadController = true;   // 由此刻起本頁已被 SW 接管
        if (isFirstClaim) return;  // 首次安裝內容已是最新，毋須 reload

        const ae = document.activeElement;
        if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) {
          showUpdatePill();
          return;
        }
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .then((reg) => {
            const check = () => reg.update().catch(() => {});
            // 由背景返回前景時檢查（iOS 最主要的更新時機）
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') check();
            });
            // 長時間停留在前景時的保險
            setInterval(check, 30 * 60 * 1000);
          })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
